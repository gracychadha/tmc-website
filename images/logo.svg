<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="150" height="110" viewBox="0 0 150 110">
  <title>TMC Corporation Logo</title>

  <!-- Main yellow circle -->
  <circle cx="75" cy="45" r="45" fill="#ebc024"/>

  <!-- TMC monogram -->
  <text x="75" y="61"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="42"
        font-weight="300"
        letter-spacing="-2"
        fill="#000000">tmc</text>

  <!-- Company name -->
  <text x="75" y="106"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12"
        font-weight="700"
        letter-spacing="-0.5"
        fill="#ebc024">Tee Mac Corporation</text>
</svg>
